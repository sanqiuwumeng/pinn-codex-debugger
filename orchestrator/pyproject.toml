[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-strategy-orchestrator"
version = "0.1.0"
description = "Governed LangGraph orchestration and assurance services for PINN experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "pydantic==2.13.4",
  "pint==0.25.3",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "mlflow==3.14.0",
  "qdrant-client==1.18.0",
  "fastembed==0.8.0",
  "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
